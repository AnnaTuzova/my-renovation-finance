<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24483f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Мой ремонт</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#20342f;background:#f5f5ef}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#24483f;color:white;padding:22px 20px 18px}header h1{margin:0;font-size:23px}header small{opacity:.75}main{max-width:680px;margin:auto;padding:16px 16px 104px}.card{background:white;border-radius:19px;padding:18px;margin-bottom:13px;box-shadow:0 2px 12px #173a2910}.muted{color:#78837c;font-size:13px}.big{font-size:31px;font-weight:750;margin:5px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.month button,.iconbtn{border:0;background:#e5ebe5;border-radius:11px;padding:10px 14px}.category{display:flex;align-items:center;gap:12px;width:100%;border:0;background:white;text-align:left;padding:15px;border-radius:16px;margin-bottom:9px}.dot{height:40px;width:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none}.grow{flex:1;min-width:0}.amount{font-weight:750;white-space:nowrap}.bar{height:5px;background:#e9eeeb;border-radius:8px;margin-top:8px;overflow:hidden}.bar>div{height:100%;background:#5c9380;border-radius:8px}.tabs{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;border-top:1px solid #e5eae5;padding:9px 4px max(10px,env(safe-area-inset-bottom))}.tabs button{border:0;background:none;color:#7b8981;min-width:85px;padding:7px 4px;font-size:12px}.tabs button.active{color:#245b48;font-weight:750}.tabs span{display:block;font-size:23px}.primary{border:0;background:#27634e;color:white;border-radius:13px;padding:13px 17px;font-weight:650}.secondary{border:1px solid #dbe4dd;background:white;border-radius:13px;padding:12px}.danger{color:#a73434}.sectiontitle{font-size:17px;font-weight:750;margin:20px 0 12px}.operation{display:flex;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid #eef0eb;cursor:pointer}.operation:last-child{border:0}.operation .comment{font-size:12px;color:#839088;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}.empty{text-align:center;padding:32px 14px;color:#839088}.fab{position:fixed;right:20px;bottom:88px;background:#27634e;color:white;border:0;border-radius:18px;width:55px;height:55px;font-size:31px;box-shadow:0 6px 20px #224c3a55}dialog{border:0;border-radius:20px;width:min(94vw,440px);padding:22px;box-shadow:0 20px 80px #0004}dialog::backdrop{background:#172d2777}dialog h2{margin:0 0 17px}label{display:block;font-size:13px;color:#62766b;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid #d9e2dc;border-radius:11px;padding:12px;background:#fff;color:#243d32}textarea{min-height:86px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px;flex-wrap:wrap}.pill{font-size:12px;background:#e7efe9;color:#326b52;padding:5px 9px;border-radius:12px}.statbar{display:flex;align-items:center;gap:10px;margin:11px 0}.statbar .name{width:110px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.statbar .track{flex:1;background:#edf0ec;height:12px;border-radius:9px;overflow:hidden}.statbar .fill{height:100%;background:#5c9380}.statbar .value{font-size:12px;width:88px;text-align:right}.hide{display:none!important}.notice{font-size:12px;color:#78837c;line-height:1.5}.toolrow{display:flex;gap:8px;flex-wrap:wrap}.toolrow button{flex:1}.datehead{font-weight:700;margin:22px 0 4px} .cattools{display:flex;gap:6px}.cattools button{border:0;background:#f0f4ef;border-radius:10px;padding:8px}
</style></head><body><header><h1>Мой ремонт</h1><small>Все расходы в одном месте</small></header><main><section id="categories"></section><section id="operations" class="hide"></section><section id="stats" class="hide"></section></main><button id="fab" class="fab" aria-label="Добавить расход">+</button><nav class="tabs"><button data-tab="categories" class="active"><span>▦</span>Категории</button><button data-tab="operations"><span>☷</span>Операции</button><button data-tab="stats"><span>◉</span>Обзор</button></nav>
<dialog id="expenseDialog"><form id="expenseForm"><h2 id="expenseTitle">Новый расход</h2><input type="hidden" id="expenseId"><label for="sum">Сумма, ₽</label><input id="sum" type="number" min="0.01" step="0.01" inputmode="decimal" required><label for="category">Категория</label><select id="category" required></select><label for="date">Дата</label><input id="date" type="date" required><label for="comment">Комментарий</label><textarea id="comment" placeholder="Например, доставка штукатурки"></textarea><div class="actions"><button type="button" id="deleteExpense" class="secondary danger hide">Удалить</button><button type="button" class="secondary" data-close>Отмена</button><button class="primary">Сохранить</button></div></form></dialog>
<dialog id="catDialog"><form id="catForm"><h2 id="catTitle">Новая категория</h2><input type="hidden" id="catId"><label for="catName">Название</label><input id="catName" maxlength="70" required><label for="catEmoji">Значок (эмодзи)</label><input id="catEmoji" maxlength="8" placeholder="🧱"><div class="actions"><button type="button" id="deleteCat" class="secondary danger hide">Удалить</button><button type="button" class="secondary" data-close>Отмена</button><button class="primary">Сохранить</button></div></form></dialog>
<script src="app.js" defer></script></body></html>
